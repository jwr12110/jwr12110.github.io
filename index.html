<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 포털</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #0f172a; /* Dark background */
            color: white;
            min-height: 100vh;
        }

        /* --- Liquid Background Blobs --- */
        .blobs-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.7;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: linear-gradient(180deg, #7c3aed 0%, #4f46e5 100%);
            animation-duration: 12s;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: linear-gradient(180deg, #ec4899 0%, #db2777 100%);
            animation-duration: 15s;
            animation-direction: alternate-reverse;
        }

        .blob-3 {
            top: 40%;
            left: 40%;
            width: 30vw;
            height: 30vw;
            background: linear-gradient(180deg, #3b82f6 0%, #06b6d4 100%);
            animation-duration: 18s;
            mix-blend-mode: overlay;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 50px) scale(1.1); }
            100% { transform: translate(-20px, -30px) scale(0.9); }
        }

        /* --- Glassmorphism Styles --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px 0 rgba(0, 0, 0, 0.4);
        }

        .glass-text-gradient {
            background: linear-gradient(to right, #e2e8f0, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        /* 3D Tilt Effect Container */
        .tilt-container {
            perspective: 1000px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Background Liquid Effects -->
    <div class="blobs-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Content Container -->
    <main class="w-full max-w-4xl relative z-10">
        
        <!-- Header Section -->
        <div class="text-center mb-12 animate-fade-in-up">
            <span class="inline-block px-3 py-1 mb-4 text-xs font-semibold tracking-wider text-blue-200 uppercase bg-blue-500 bg-opacity-20 rounded-full border border-blue-400 border-opacity-30">
                Welcome to Our Portal
            </span>
            <h1 class="text-5xl md:text-7xl font-bold mb-4 font-['Outfit'] tracking-tight text-white drop-shadow-lg">
                우리의 웹페이지
            </h1>
            <p class="text-lg text-slate-300 max-w-xl mx-auto font-light">
                최신 기술과 편리한 도구를 경험해보세요. <br>
                아래 카드에서 원하시는 서비스를 선택하세요.
            </p>
        </div>

        <!-- Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 px-4 tilt-container">
            
            <!-- Link 1: Deep Learning -->
            <a href="deeplearning.html" class="glass-card group rounded-2xl p-8 flex flex-col items-center text-center h-80 justify-center relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-purple-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                
                <div class="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300 shadow-[0_0_20px_rgba(168,85,247,0.3)]">
                    <i class="fas fa-brain text-4xl text-purple-300"></i>
                </div>
                
                <h2 class="text-2xl font-bold mb-3 text-white">딥러닝 게임</h2>
                <p class="text-slate-300 text-sm leading-relaxed px-4">
                    AI 모델과 상호작용하며 딥러닝의 원리를<br>재미있게 배워보세요.
                </p>
                
                <div class="mt-6 flex items-center text-purple-300 text-sm font-semibold group-hover:text-white transition-colors">
                    <span>게임 시작하기</span>
                    <i class="fas fa-arrow-right ml-2 transform group-hover:translate-x-1 transition-transform"></i>
                </div>
            </a>

            <!-- Link 2: Seating Arrangement -->
            <a href="seatingarrangement.html" class="glass-card group rounded-2xl p-8 flex flex-col items-center text-center h-80 justify-center relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                
                <div class="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300 shadow-[0_0_20px_rgba(16,185,129,0.3)]">
                    <i class="fas fa-chalkboard-user text-4xl text-emerald-300"></i>
                </div>
                
                <h2 class="text-2xl font-bold mb-3 text-white">자리 배치 프로그램</h2>
                <p class="text-slate-300 text-sm leading-relaxed px-4">
                    랜덤 생성부터 드래그 수정까지.<br>학급 관리를 위한 스마트한 도구입니다.
                </p>
                
                <div class="mt-6 flex items-center text-emerald-300 text-sm font-semibold group-hover:text-white transition-colors">
                    <span>배치 시작하기</span>
                    <i class="fas fa-arrow-right ml-2 transform group-hover:translate-x-1 transition-transform"></i>
                </div>
            </a>

        </div>

        <footer class="text-center mt-16 text-slate-500 text-sm">
            &copy; 2024 Our Web Service. All rights reserved.
        </footer>
    </main>

    <!-- Optional: Vanilla JS Tilt Effect (Simple version) -->
    <script>
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Calculate percentage
                const xPct = x / rect.width - 0.5;
                const yPct = y / rect.height - 0.5;
                
                // Rotation
                const xRot = yPct * -10; // Reverse axis for tilt
                const yRot = xPct * 10;
                
                card.style.transform = `perspective(1000px) rotateX(${xRot}deg) rotateY(${yRot}deg) scale(1.02)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
            });
        });
    </script>
</body>
</html>
