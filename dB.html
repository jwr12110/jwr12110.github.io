<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소음 측정기 & 경고 시스템</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            transition: background-color 0.3s;
        }

        .meter-container {
            position: relative;
            width: 100%;
            height: 30px;
            background-color: #e5e7eb;
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        .meter-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80 0%, #facc15 70%, #ef4444 100%);
            width: 0%;
            transition: width 0.1s linear;
        }

        .threshold-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: #000;
            transform: translateX(-50%);
            z-index: 10;
            transition: left 0.3s ease-out;
        }

        .warning-active {
            animation: pulse-red 0.5s infinite;
        }

        @keyframes pulse-red {
            0% { background-color: #fee2e2; }
            50% { background-color: #fca5a5; }
            100% { background-color: #fee2e2; }
        }

        .btn-preset {
            transition: all 0.2s;
        }
        .btn-preset.active {
            ring-width: 4px;
            --tw-ring-color: rgb(59 130 246 / 0.5);
            font-weight: 700;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4" id="mainBody">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-microphone-lines text-blue-500 mr-2"></i>소음 측정기</h1>
            <p class="text-gray-500 text-sm mt-1">지정된 소음을 넘으면 경고합니다.</p>
        </div>

        <!-- Main Display -->
        <div class="text-center space-y-2">
            <div class="text-6xl font-mono font-bold text-gray-800 transition-colors" id="dbDisplay">0</div>
            <div class="text-sm text-gray-400">DECIBELS (Approx)</div>
        </div>

        <!-- Visual Meter -->
        <div class="relative pt-2 pb-6">
            <div class="flex justify-between text-xs text-gray-400 mb-1 px-1">
                <span>0</span>
                <span>50</span>
                <span>100</span>
            </div>
            <div class="meter-container">
                <div class="meter-fill" id="meterFill"></div>
                <div class="threshold-marker" id="thresholdMarker" style="left: 30%;"></div>
            </div>
            <div class="text-center mt-2 text-sm font-medium text-gray-600">
                현재 설정: <span id="thresholdDisplay" class="text-blue-600">30</span> dB 이상 경고
            </div>
        </div>

        <!-- Presets -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="setThreshold(30, 'study')" id="btnStudy" class="btn-preset active bg-green-100 hover:bg-green-200 text-green-800 py-3 px-4 rounded-xl flex flex-col items-center justify-center gap-2 border border-green-200">
                <i class="fas fa-book-open text-xl"></i>
                <span>공부 시간 (30dB)</span>
            </button>
            <button onclick="setThreshold(60, 'break')" id="btnBreak" class="btn-preset bg-orange-100 hover:bg-orange-200 text-orange-800 py-3 px-4 rounded-xl flex flex-col items-center justify-center gap-2 border border-orange-200">
                <i class="fas fa-coffee text-xl"></i>
                <span>쉬는 시간 (60dB)</span>
            </button>
        </div>

        <!-- Sensitivity Slider -->
        <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
            <label class="flex justify-between text-xs text-gray-500 mb-1">
                <span>마이크 민감도 보정</span>
                <span id="sensitivityValue">1.0x</span>
            </label>
            <input type="range" min="0.5" max="3.0" step="0.1" value="1.5" id="sensitivityRange" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-500">
        </div>

        <!-- Main Controls -->
        <div class="flex gap-3 pt-2">
            <button id="btnStart" onclick="startMetering()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transform active:scale-95 transition flex items-center justify-center gap-2">
                <i class="fas fa-play"></i> 측정 시작
            </button>
            <button id="btnStop" onclick="stopMetering()" class="hidden flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transform active:scale-95 transition flex items-center justify-center gap-2">
                <i class="fas fa-stop"></i> 중지
            </button>
        </div>
        
        <!-- Mute Toggle -->
        <div class="flex items-center justify-center gap-2 text-gray-500 text-sm cursor-pointer" onclick="toggleMute()">
            <div id="muteIcon"><i class="fas fa-volume-up"></i></div>
            <span id="muteText">경고음 켜짐</span>
        </div>

    </div>

    <!-- Error Modal (Hidden by default) -->
    <div id="errorModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full">
            <h3 class="text-lg font-bold text-red-600 mb-2">마이크 접근 오류</h3>
            <p class="text-gray-600 mb-4">마이크 권한이 허용되지 않았거나 장치를 찾을 수 없습니다.</p>
            <button onclick="document.getElementById('errorModal').classList.add('hidden')" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded">닫기</button>
        </div>
    </div>

    <script>
        let audioContext;
        let analyser;
        let microphone;
        let javascriptNode;
        let isRunning = false;
        let currentThreshold = 30;
        let sensitivity = 1.5;
        let isMuted = false;
        let lastAlertTime = 0;
        const alertCooldown = 1000; // 1 second cooldown for sound

        // DOM Elements
        const dbDisplay = document.getElementById('dbDisplay');
        const meterFill = document.getElementById('meterFill');
        const thresholdMarker = document.getElementById('thresholdMarker');
        const thresholdDisplay = document.getElementById('thresholdDisplay');
        const mainBody = document.getElementById('mainBody');
        const sensitivityRange = document.getElementById('sensitivityRange');

        // Initial setup
        setThreshold(30, 'study');

        // Event Listeners for Sensitivity
        sensitivityRange.addEventListener('input', (e) => {
            sensitivity = parseFloat(e.target.value);
            document.getElementById('sensitivityValue').innerText = sensitivity + "x";
        });

        function setThreshold(val, mode) {
            currentThreshold = val;
            thresholdDisplay.innerText = val;
            thresholdMarker.style.left = val + "%";

            // UI Update
            document.querySelectorAll('.btn-preset').forEach(btn => btn.classList.remove('active'));
            if(mode === 'study') document.getElementById('btnStudy').classList.add('active');
            if(mode === 'break') document.getElementById('btnBreak').classList.add('active');
        }

        function toggleMute() {
            isMuted = !isMuted;
            const icon = document.getElementById('muteIcon');
            const text = document.getElementById('muteText');
            
            if (isMuted) {
                icon.innerHTML = '<i class="fas fa-volume-mute text-gray-400"></i>';
                text.innerText = '경고음 꺼짐';
                text.classList.add('text-gray-400');
            } else {
                icon.innerHTML = '<i class="fas fa-volume-up text-blue-500"></i>';
                text.innerText = '경고음 켜짐';
                text.classList.remove('text-gray-400');
            }
        }

        async function startMetering() {
            try {
                if (isRunning) return;

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                microphone = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.smoothingTimeConstant = 0.8;
                analyser.fftSize = 1024;

                microphone.connect(analyser);

                // Use a ScriptProcessor (or requestAnimationFrame loop) to monitor volume
                // Note: ScriptProcessor is deprecated but widely supported for simple metering. 
                // Alternatively we can use requestAnimationFrame. Let's use requestAnimationFrame for better performance.
                isRunning = true;
                
                document.getElementById('btnStart').classList.add('hidden');
                document.getElementById('btnStop').classList.remove('hidden');

                visualize();

            } catch (err) {
                console.error("Microphone Access Error:", err);
                document.getElementById('errorModal').classList.remove('hidden');
            }
        }

        function stopMetering() {
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            isRunning = false;
            dbDisplay.innerText = "0";
            meterFill.style.width = "0%";
            mainBody.classList.remove('warning-active');
            
            document.getElementById('btnStart').classList.remove('hidden');
            document.getElementById('btnStop').classList.add('hidden');
        }

        function visualize() {
            if (!isRunning) return;

            const array = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(array);

            // Calculate average volume
            let values = 0;
            const length = array.length;
            for (let i = 0; i < length; i++) {
                values += array[i];
            }
            const average = values / length;

            // Normalize and scale to simplified dB-like value (0-100)
            // Real dB requires calibration, this is a relative approximation
            // Sensitivity adjusts the input gain logic
            let scaledDb = Math.round(average * sensitivity); 
            
            // Clamp value
            if (scaledDb > 100) scaledDb = 100;
            if (scaledDb < 0) scaledDb = 0;

            updateUI(scaledDb);

            requestAnimationFrame(visualize);
        }

        function updateUI(db) {
            dbDisplay.innerText = db;
            meterFill.style.width = db + "%";

            // Check Threshold
            if (db >= currentThreshold) {
                triggerWarning();
                dbDisplay.classList.add('text-red-600');
                dbDisplay.classList.remove('text-gray-800');
            } else {
                mainBody.classList.remove('warning-active');
                dbDisplay.classList.remove('text-red-600');
                dbDisplay.classList.add('text-gray-800');
            }
        }

        function triggerWarning() {
            // Visual warning
            mainBody.classList.add('warning-active');

            // Audio warning (Beep)
            const now = Date.now();
            if (!isMuted && now - lastAlertTime > alertCooldown) {
                playBeep();
                lastAlertTime = now;
            }
        }

        function playBeep() {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioContext.currentTime); // A5
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            
            oscillator.start();
            
            // Fade out
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.5);
            oscillator.stop(audioContext.currentTime + 0.5);
        }
    </script>
</body>
</html>
