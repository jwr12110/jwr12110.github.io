<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학급 활동 체크리스트 - Sketchbook Ver.</title>
    <!-- Tailwind CSS (레이아웃 보조) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Gamja Flower) -->
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">

    <style>
        /* 1. 기본 배경 및 폰트 설정 (Doodle 테마) */
        body {
            font-family: 'Gamja Flower', cursive;
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(#e5e7eb 1px, transparent 1px),
                linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
            color: #4b5563;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* 2. 손그림 박스 스타일 (Doodle Box) */
        .doodle-box {
            background: white;
            border: 2px solid #4b5563;
            /* 울퉁불퉁한 테두리 */
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 3. 테이프 효과 (Tape) */
        .tape {
            background-color: rgba(253, 230, 138, 0.8); /* 노란색 테이프 */
            width: 120px;
            height: 35px;
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            backdrop-filter: blur(2px);
            border-left: 2px dashed rgba(255,255,255,0.5);
            border-right: 2px dashed rgba(255,255,255,0.5);
            z-index: 10;
        }

        /* 4. 버튼 스타일 (손그림 느낌) */
        .btn-doodle {
            border: 2px solid #4b5563;
            border-radius: 10px 20px 10px 20px;
            padding: 8px 16px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.1s;
            background-color: white;
            color: #4b5563;
            font-family: inherit;
        }
        .btn-doodle:hover {
            transform: scale(1.05) rotate(-1deg);
        }
        .btn-doodle:active {
            transform: scale(0.95);
        }
        
        /* 버튼 색상 변형 */
        .btn-primary { background-color: #dbeafe; } /* 파랑 */
        .btn-secondary { background-color: #fce7f3; } /* 분홍 */
        .btn-accent { background-color: #d1fae5; } /* 초록 */

        /* 5. 입력창 스타일 */
        textarea, input[type="number"] {
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px;
            font-family: inherit;
            font-size: 1.1rem;
            background: #fff;
            transition: border-color 0.2s;
            outline: none;
        }
        textarea:focus, input[type="number"]:focus {
            border-color: #4b5563;
            background: #fafafa;
        }

        /* 6. 학생 카드 그리드 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 30px;
        }

        /* 7. 학생 카드 디자인 */
        .student-card {
            position: relative;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            overflow: visible; /* 체크 표시가 튀어나올 수 있게 */
        }
        .student-card:hover {
            transform: translateY(-3px) rotate(1deg);
            box-shadow: 4px 6px 15px rgba(0,0,0,0.1);
        }

        .student-number {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 5px;
            display: block;
        }

        .student-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #374151;
            background: transparent;
            border-bottom: 2px dashed transparent;
        }
        .student-name:focus {
            outline: none;
            border-bottom: 2px dashed #4b5563;
            background: rgba(255,255,255,0.5);
        }

        /* 8. 체크된 상태 (형광펜 효과 + 빨간 체크) */
        .student-card.checked {
            background-color: #fef3c7; /* 노란 형광펜 배경 */
            border-color: #d97706;
            transform: rotate(-1deg);
        }

        .student-card.checked::after {
            content: '\f00c'; /* FontAwesome Check Icon */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: -10px;
            right: -10px;
            color: #ef4444; /* 빨간색 체크 */
            font-size: 1.8rem;
            animation: stamp 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 2px 2px 0px rgba(255,255,255,1);
        }

        @keyframes stamp {
            0% { transform: scale(3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 형광펜 밑줄 효과 */
        .pen-underline {
            position: relative;
            display: inline-block;
            z-index: 1;
        }
        .pen-underline::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 10px;
            bottom: 5px;
            left: 0;
            background-color: #fcd34d; /* 노란색 */
            opacity: 0.5;
            z-index: -1;
            border-radius: 4px;
            transform: rotate(-1deg);
        }

    </style>
</head>
<body>

    <!-- 헤더 -->
    <header class="text-center mb-10">
        <h1 class="text-5xl md:text-6xl text-gray-800 mb-2">
            <i class="fa-solid fa-clipboard-check mr-2 text-gray-600"></i>
            <span class="pen-underline">학급 활동 체크리스트</span>
        </h1>
        <p class="text-xl text-gray-500 mt-2">
            <i class="fa-solid fa-pencil text-sm"></i> 이름을 클릭해서 확인 도장을 찍어보세요!
        </p>
    </header>

    <!-- 컨트롤 패널 (테이프로 붙인 메모지 느낌) -->
    <div class="relative w-full max-w-3xl mb-8">
        <div class="tape"></div> <!-- 테이프 장식 -->
        <div class="doodle-box p-8 flex flex-col items-center gap-6">
            
            <!-- 입력 영역 -->
            <div class="w-full">
                <textarea id="nameInput" class="w-full h-24 resize-none" 
                    placeholder="학생 이름을 입력하세요. (예: 김철수, 이영희, 박민수)&#13;&#10;줄바꿈(엔터)이나 쉼표(,)로 구분됩니다."></textarea>
                <div class="text-left text-gray-400 text-sm mt-1 ml-1">
                    💡 이름을 붙여넣고 아래 '명단 생성' 버튼을 꾹 누르세요.
                </div>
            </div>

            <!-- 버튼 그룹 -->
            <div class="flex flex-wrap gap-4 justify-center items-center w-full">
                <button class="btn-doodle btn-primary" onclick="generateFromList()">
                    <i class="fa-solid fa-list mr-1"></i> 입력 명단 생성
                </button>
                
                <div class="flex items-center gap-2 bg-gray-50 px-3 py-1 rounded-lg border-2 border-dashed border-gray-200">
                    <input type="number" id="randomCount" value="25" min="1" max="100" class="w-16 text-center !border-gray-300">
                    <span class="text-lg">명</span>
                    <button class="btn-doodle btn-secondary" onclick="generateRandom()">
                        <i class="fa-solid fa-shuffle mr-1"></i> 랜덤 생성
                    </button>
                </div>

                <button class="btn-doodle btn-accent" onclick="resetChecks()">
                    <i class="fa-solid fa-eraser mr-1"></i> 체크 초기화
                </button>
            </div>

            <!-- 상태 바 -->
            <div class="w-full border-t-2 border-dashed border-gray-200 pt-4 text-center text-2xl">
                완료: <span id="completedCount" class="text-red-500 font-bold">0</span> 
                <span class="text-gray-300 mx-2">/</span> 
                <span id="totalCount">0</span>
            </div>
        </div>
    </div>

    <!-- 학생 카드 그리드 -->
    <div id="studentGrid" class="grid-container pb-20">
        <!-- 자바스크립트로 카드가 생성됩니다 -->
    </div>

    <script>
        // --- 기존 기능 로직 유지 ---

        // 랜덤 이름 데이터
        const lastNames = ["김", "이", "박", "최", "정", "강", "조", "윤", "장", "임", "한", "오", "서", "신", "권", "황", "안", "송", "류", "전", "홍", "고", "문", "양", "손", "배", "조", "백", "허", "유"];
        const firstNames = ["민준", "서준", "도윤", "예준", "시우", "하준", "지호", "지우", "준우", "서현", "서연", "지우", "지유", "하은", "서윤", "민서", "지안", "윤서", "채원", "다은", "은우", "수아", "나은", "예린", "시윤", "유준", "현우", "건우", "우진", "민재"];

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }

        function generateRandomName() {
            const last = lastNames[getRandomInt(lastNames.length)];
            const first = firstNames[getRandomInt(firstNames.length)];
            return last + first;
        }

        window.onload = function() {
            generateRandom();
        };

        // 1. 랜덤 명단 생성
        function generateRandom() {
            const countInput = document.getElementById('randomCount');
            let count = parseInt(countInput.value);
            
            if (count < 1) count = 1;
            if (count > 200) {
                alert("최대 200명까지만 가능합니다.");
                count = 200;
                countInput.value = 200;
            }

            const names = [];
            for(let i=0; i<count; i++) {
                names.push(generateRandomName());
            }
            
            document.getElementById('nameInput').value = names.join(', ');
            createCards(names);
        }

        // 2. 입력 명단 생성
        function generateFromList() {
            const input = document.getElementById('nameInput').value;
            
            if (!input.trim()) {
                alert("이름을 입력해주세요!");
                return;
            }

            let names = input.split(/[\n,]+/).map(name => name.trim()).filter(name => name !== "");

            if (names.length === 0) {
                alert("유효한 이름이 없습니다.");
                return;
            }

            createCards(names);
        }

        // 카드 생성 로직
        function createCards(nameList) {
            const grid = document.getElementById('studentGrid');
            const totalCountSpan = document.getElementById('totalCount');
            const completedCountSpan = document.getElementById('completedCount');

            grid.innerHTML = '';
            completedCountSpan.textContent = '0';
            totalCountSpan.textContent = nameList.length;

            nameList.forEach((name, index) => {
                const card = document.createElement('div');
                // 스타일 클래스: doodle-box 추가
                card.className = 'student-card doodle-box'; 
                
                card.onclick = function(e) { 
                    if (e.target.isContentEditable) return;
                    toggleCheck(this); 
                };
                
                const numberSpan = document.createElement('span');
                numberSpan.className = 'student-number';
                numberSpan.textContent = (index + 1) + '번';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'student-name';
                nameDiv.textContent = name;
                nameDiv.contentEditable = true;
                
                nameDiv.onkeydown = function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.blur();
                    }
                };

                card.appendChild(numberSpan);
                card.appendChild(nameDiv);
                grid.appendChild(card);
            });
        }

        function toggleCheck(cardElement) {
            cardElement.classList.toggle('checked');
            updateCount();
        }

        function resetChecks() {
            const cards = document.querySelectorAll('.student-card');
            cards.forEach(card => {
                card.classList.remove('checked');
            });
            updateCount();
        }

        function updateCount() {
            const checkedCards = document.querySelectorAll('.student-card.checked');
            const completedCountSpan = document.getElementById('completedCount');
            completedCountSpan.textContent = checkedCards.length;
        }
    </script>
</body>
</html>
