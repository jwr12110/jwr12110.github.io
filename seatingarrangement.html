<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학급 자리 배치 프로그램</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* 드래그 앤 드롭 관련 스타일 */
        .grid-cell {
            aspect-ratio: 4/3;
            transition: all 0.2s;
        }

        .grid-cell.drag-over {
            background-color: #dbeafe;
            /* bg-blue-100 */
            border: 2px dashed #3b82f6;
        }

        .desk {
            cursor: move;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
        }

        .desk:active {
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .desk.assigned {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
        }

        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">
                <i class="fa-solid fa-shapes"></i>
                우리 수업 도구
            </a>
            <button class="mobile-menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('active')">
                <i class="fa-solid fa-bars"></i>
            </button>
            <ul class="nav-links">
                <li><a href="../index.html" class="nav-link">홈</a></li>
                <li><a href="timer.html" class="nav-link">타이머</a></li>
                <li><a href="seatingarrangement.html" class="nav-link">자리배치</a></li>
                <li><a href="roulette.html" class="nav-link">돌림판</a></li>
                <li><a href="dB.html" class="nav-link">소음측정기</a></li>
                <li><a href="checklist.html" class="nav-link">체크리스트</a></li>
                <li><a href="score.html" class="nav-link">점수판</a></li>
            </ul>
        </div>
    </nav>

    <!-- Header -->
    <header class="text-center my-10">
        <h1 class="text-5xl font-bold text-gray-800 mb-2">
            <span class="pen-underline">자리 배치</span>
        </h1>
        <p class="text-xl text-gray-500">학생 수를 입력하고 책상을 배치한 뒤 자리를 배정해보세요.</p>
    </header>

    <main class="w-full max-w-6xl mx-auto px-4 pb-10">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <!-- 왼쪽 패널: 설정 및 학생 목록 -->
            <div class="lg:col-span-4 space-y-6">
                <!-- 1. 설정 카드 -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
                    <h2 class="text-lg font-bold mb-4 flex items-center">
                        <span
                            class="bg-blue-100 text-blue-600 w-6 h-6 rounded-full flex items-center justify-center text-sm mr-2">1</span>
                        학생 설정
                    </h2>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">학생 수</label>
                            <div class="flex gap-2">
                                <input type="number" id="studentCountInput" min="1" max="50" value="20"
                                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <button onclick="generateStudentInputs()"
                                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors whitespace-nowrap">
                                    설정
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. 학생 명단 카드 -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 flex flex-col h-[500px]">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold flex items-center">
                            <span
                                class="bg-blue-100 text-blue-600 w-6 h-6 rounded-full flex items-center justify-center text-sm mr-2">2</span>
                            학생 명단
                        </h2>
                        <span class="text-xs text-slate-400" id="studentCountDisplay">0명</span>
                    </div>

                    <div id="studentListContainer" class="flex-1 overflow-y-auto space-y-2 pr-2">
                        <!-- 학생 입력 필드가 여기에 생성됩니다 -->
                        <div class="text-center text-slate-400 py-10">
                            먼저 학생 수를 설정해주세요.
                        </div>
                    </div>

                    <div class="mt-4 pt-4 border-t border-slate-100">
                        <button onclick="regenerateRandomNames()"
                            class="w-full py-2 text-sm text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">
                            <i class="fas fa-sync-alt mr-1"></i> 이름 전체 랜덤 재생성
                        </button>
                    </div>
                </div>
            </div>

            <!-- 오른쪽 패널: 교실 배치도 -->
            <div class="lg:col-span-8 space-y-6">
                <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 min-h-[600px] flex flex-col">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                        <div>
                            <h2 class="text-lg font-bold flex items-center">
                                <span
                                    class="bg-blue-100 text-blue-600 w-6 h-6 rounded-full flex items-center justify-center text-sm mr-2">3</span>
                                교실 배치
                            </h2>
                            <p class="text-xs text-slate-500 mt-1 ml-8">책상을 드래그하여 위치를 옮기거나, 빈 공간을 클릭해 책상을 추가/제거하세요.</p>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="resetLayout()"
                                class="px-3 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm transition-colors">
                                <i class="fas fa-undo mr-1"></i> 배치 초기화
                            </button>
                            <button onclick="assignSeats()"
                                class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-md transition-colors font-medium">
                                <i class="fas fa-check mr-1"></i> 자리 배정하기
                            </button>
                        </div>
                    </div>

                    <!-- 칠판 영역 -->
                    <div class="w-full bg-slate-700 h-8 rounded-lg mb-8 flex items-center justify-center shadow-inner">
                        <span class="text-slate-300 text-xs tracking-widest">CHALKBOARD (FRONT)</span>
                    </div>

                    <!-- 좌석 그리드 -->
                    <div id="classroomGrid"
                        class="grid grid-cols-6 gap-3 flex-1 bg-slate-50 p-4 rounded-xl border-2 border-dashed border-slate-200 relative">
                        <!-- 그리드 셀과 책상이 여기에 생성됩니다 -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 모달: 결과 알림 -->
    <div id="alertModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl transform transition-all scale-100">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 mb-4">
                    <i class="fas fa-info text-blue-600 text-xl"></i>
                </div>
                <h3 class="text-lg font-medium text-gray-900 mb-2" id="alertTitle">알림</h3>
                <p class="text-sm text-gray-500 mb-6" id="alertMessage">메시지 내용</p>
                <button onclick="closeModal()"
                    class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none sm:text-sm">
                    확인
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 데이터 ---
        const firstNames = ['민준', '서준', '도윤', '예준', '시우', '하준', '지호', '주원', '지후', '준우', '서연', '서윤', '지우', '서현', '하은', '하윤', '민서', '지유', '윤서', '채원', '수호', '은우', '선우', '정우', '건우', '우진', '현준', '민재', '유준', '지아', '서아', '다은', '소율', '예린', '수아', '아린', '소윤', '시아', '하린'];
        const lastNames = ['김', '이', '박', '최', '정', '강', '조', '윤', '장', '임', '한', '오', '서', '신', '권', '황', '안', '송', '전', '홍'];

        // 상태 관리
        let students = []; // { id, name }
        let gridCols = 6;
        let gridRows = 5; // 여유 있게 5행

        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            initGrid();
            generateStudentInputs(); // 초기 20명 생성
        });

        // --- 유틸리티 함수 ---
        function getRandomName() {
            const last = lastNames[Math.floor(Math.random() * lastNames.length)];
            const first = firstNames[Math.floor(Math.random() * firstNames.length)];
            return last + first;
        }

        function showAlert(title, message) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('alertModal').classList.remove('hidden');
            document.getElementById('alertModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('alertModal').classList.add('hidden');
            document.getElementById('alertModal').classList.remove('flex');
        }

        // --- 1. 학생 관리 ---
        function generateStudentInputs() {
            const countInput = document.getElementById('studentCountInput');
            let count = parseInt(countInput.value);

            if (count < 1) count = 1;
            if (count > 50) {
                showAlert("입력 오류", "학생 수는 최대 50명까지만 가능합니다.");
                count = 50;
                countInput.value = 50;
            }

            const container = document.getElementById('studentListContainer');
            container.innerHTML = '';
            students = [];

            for (let i = 0; i < count; i++) {
                const name = getRandomName();
                students.push({ id: i, name: name });

                const div = document.createElement('div');
                div.className = "flex items-center gap-2 animate-fade-in";
                div.innerHTML = `
                    <span class="text-slate-400 text-sm w-6 text-center">${i + 1}</span>
                    <input type="text" value="${name}" data-index="${i}" 
                        class="student-name-input flex-1 px-3 py-2 text-sm border border-slate-200 rounded focus:outline-none focus:border-blue-500 transition-colors"
                        onchange="updateStudentName(${i}, this.value)">
                `;
                container.appendChild(div);
            }

            document.getElementById('studentCountDisplay').innerText = `${count}명`;

            // 학생 수가 책상 수보다 많으면 경고
            const activeDesks = document.querySelectorAll('.desk').length;
            if (count > activeDesks) {
                // 책상이 부족하면 자동으로 추가 (단순화: 기본 배치 복구 혹은 알림)
            }
        }

        function updateStudentName(index, newName) {
            students[index].name = newName;
        }

        function regenerateRandomNames() {
            const inputs = document.querySelectorAll('.student-name-input');
            inputs.forEach((input, index) => {
                const newName = getRandomName();
                input.value = newName;
                students[index].name = newName;
            });
        }

        // --- 2. 그리드 및 책상 관리 ---
        function initGrid() {
            const grid = document.getElementById('classroomGrid');
            grid.innerHTML = '';

            // 6열 5행 그리드 생성 (총 30칸)
            for (let i = 0; i < gridCols * gridRows; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell bg-slate-200 rounded-lg flex items-center justify-center relative border border-slate-300';
                cell.dataset.index = i;

                // 드래그 이벤트 리스너 (셀)
                cell.addEventListener('dragover', handleDragOver);
                cell.addEventListener('drop', handleDrop);
                cell.addEventListener('click', handleCellClick); // 클릭으로 책상 추가/제거

                // 기본 배치: 6열 4행 (총 24개)
                if (i < 24) {
                    addDeskToCell(cell);
                }

                grid.appendChild(cell);
            }
        }

        function createDeskElement() {
            const desk = document.createElement('div');
            desk.className = 'desk w-11/12 h-5/6 bg-white border-2 border-slate-300 rounded-lg shadow-sm flex flex-col items-center justify-center relative z-10';
            desk.draggable = true;
            desk.innerHTML = `
                <div class="text-slate-300 mb-1 desk-icon"><i class="fas fa-chair"></i></div>
                <div class="text-sm font-bold text-slate-700 desk-name truncate w-full text-center px-1">-</div>
            `;

            // 드래그 이벤트 리스너 (책상)
            desk.addEventListener('dragstart', handleDragStart);

            return desk;
        }

        function addDeskToCell(cell) {
            if (cell.querySelector('.desk')) return;
            const desk = createDeskElement();
            cell.appendChild(desk);
            cell.classList.remove('bg-slate-200'); // 책상이 있으면 배경색 제거 (깔끔하게)
            cell.classList.add('bg-transparent');
        }

        function removeDeskFromCell(cell) {
            const desk = cell.querySelector('.desk');
            if (desk) {
                desk.remove();
                cell.classList.add('bg-slate-200');
                cell.classList.remove('bg-transparent');
            }
        }

        function handleCellClick(e) {
            if (e.target.classList.contains('grid-cell') && !e.target.querySelector('.desk')) {
                addDeskToCell(e.target);
            }
        }

        // 책상 더블 클릭 시 삭제 이벤트 위임
        document.getElementById('classroomGrid').addEventListener('dblclick', function (e) {
            const desk = e.target.closest('.desk');
            if (desk) {
                const cell = desk.parentElement;
                removeDeskFromCell(cell);
            }
        });

        function resetLayout() {
            if (confirm('배치를 6열 4행 기본값으로 초기화하시겠습니까?')) {
                const cells = document.querySelectorAll('.grid-cell');
                cells.forEach((cell, index) => {
                    removeDeskFromCell(cell);
                    if (index < 24) {
                        addDeskToCell(cell);
                    }
                });
                // 이름표 초기화
                const desks = document.querySelectorAll('.desk');
                desks.forEach(desk => {
                    desk.classList.remove('assigned');
                    desk.querySelector('.desk-name').innerText = '-';
                    desk.querySelector('.desk-icon').style.display = 'block';
                });
            }
        }

        // --- 3. 드래그 앤 드롭 로직 ---
        let draggedDesk = null;
        let sourceCell = null;

        function handleDragStart(e) {
            draggedDesk = this;
            sourceCell = this.parentElement;
            e.dataTransfer.effectAllowed = 'move';
            // 드래그 이미지 설정 (선택 사항)
            setTimeout(() => this.classList.add('opacity-50'), 0);
        }

        function handleDragOver(e) {
            e.preventDefault(); // 드롭 허용
            e.dataTransfer.dropEffect = 'move';
            const cell = e.target.closest('.grid-cell');
            if (cell) {
                cell.classList.add('drag-over');
            }
        }

        // 드래그가 셀을 벗어났을 때 스타일 제거
        document.getElementById('classroomGrid').addEventListener('dragleave', (e) => {
            const cell = e.target.closest('.grid-cell');
            if (cell) cell.classList.remove('drag-over');
        });

        function handleDrop(e) {
            e.preventDefault();
            const targetCell = e.target.closest('.grid-cell');

            // 드래그 종료 후 스타일 복구
            draggedDesk.classList.remove('opacity-50');
            document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('drag-over'));

            if (!targetCell) return;

            const existingDesk = targetCell.querySelector('.desk');

            if (targetCell === sourceCell) return;

            if (existingDesk) {
                // 교환 (Swap)
                sourceCell.appendChild(existingDesk);
                targetCell.appendChild(draggedDesk);
            } else {
                // 이동 (Move)
                targetCell.appendChild(draggedDesk);
                // 기존 셀 스타일 복구 (빈 셀 배경)
                sourceCell.classList.add('bg-slate-200');
                sourceCell.classList.remove('bg-transparent');
                // 새 셀 스타일 (투명 배경)
                targetCell.classList.remove('bg-slate-200');
                targetCell.classList.add('bg-transparent');
            }
        }

        // 드래그 종료 시 (혹시 drop 이벤트가 발생하지 않았을 경우 대비)
        document.addEventListener('dragend', () => {
            if (draggedDesk) draggedDesk.classList.remove('opacity-50');
            document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('drag-over'));
            draggedDesk = null;
            sourceCell = null;
        });

        // --- 4. 자리 배정 로직 ---
        function assignSeats() {
            const desks = Array.from(document.querySelectorAll('.desk'));
            const activeDesksCount = desks.length;
            const studentCount = students.length;

            if (activeDesksCount < studentCount) {
                showAlert("좌석 부족", `학생은 ${studentCount}명인데 책상은 ${activeDesksCount}개뿐입니다. 책상을 더 배치해주세요.`);
                return;
            }

            // 학생 명단 복사 후 셔플
            let shuffledStudents = [...students];
            // Fisher-Yates Shuffle
            for (let i = shuffledStudents.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledStudents[i], shuffledStudents[j]] = [shuffledStudents[j], shuffledStudents[i]];
            }

            // 배정 애니메이션 효과
            desks.forEach((desk, index) => {
                desk.classList.remove('assigned');
                desk.querySelector('.desk-name').innerText = '...';

                setTimeout(() => {
                    if (index < shuffledStudents.length) {
                        const student = shuffledStudents[index];
                        desk.querySelector('.desk-name').innerText = student.name;
                        desk.querySelector('.desk-icon').style.display = 'none';
                        desk.classList.add('assigned');

                        // 살짝 튀어오르는 애니메이션
                        desk.style.transform = 'scale(1.1)';
                        setTimeout(() => desk.style.transform = 'scale(1)', 200);
                    } else {
                        // 남는 책상
                        desk.querySelector('.desk-name').innerText = '(빈자리)';
                        desk.querySelector('.desk-icon').style.display = 'block';
                        desk.style.background = '#f8fafc';
                        desk.style.color = '#94a3b8';
                        desk.style.border = '2px dashed #cbd5e1';
                    }
                }, index * 50); // 순차적 효과
            });
        }
    </script>
</body>

</html>
